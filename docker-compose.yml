version: '3.8'

services:
  careerops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerops
    ports:
      - "5001:5001"  # Backend API
      - "8000:8000"  # Frontend HTTP
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5001
      - FLASK_HOST=0.0.0.0
      - AWS_REGION=us-east-2
      - CAREEROPS_USERNAME=${CAREEROPS_USERNAME}
      - CAREEROPS_PASSWORD=${CAREEROPS_PASSWORD}
      - CAREEROPS_ENCRYPTION_KEY=${CAREEROPS_ENCRYPTION_KEY}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
