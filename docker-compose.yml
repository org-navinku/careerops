version: '3.8'

services:
  careerops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerops
    ports:
      - "5001:5001"  # Backend API
      - "8000:8000"  # Frontend HTTP
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5001
      - OLLAMA_BASE=http://ollama:11434  # Ollama service (if using)
      - OLLAMA_MODEL=mistral
    volumes:
      - ./data:/app/data  # For persistent data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional: Ollama service for local LLM
  # Uncomment if you want Ollama in the same compose stack
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   restart: unless-stopped
  #
  # volumes:
  #   ollama-data:
